<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-internet</title>
<style>
  /* 方案B v5「节点总览表·去重平铺版」:
     - 出口信息只在节点表一处("使用中"标记 + 整行高亮);状态带只剩两个连通 chip
     - 直连卡删除(顶部"直连通"chip 已足够)
     - 机制细节(实测额度/花费)收进「实测历史」子页,主视图零机制噪音
     宽度自适应:卡片 max-content 定宽,460~720 限幅;文本块限宽换行不撑宽卡片。
     尺寸反馈环安全:宽度不依赖视口,panelSize 上报后弹窗贴合,无死锁。 */
  :root{ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:light-dark(#e9edf3,#0b101a);
    color:light-dark(#1b2334,#e7edf6);
    display:flex; justify-content:center; padding:20px 8px 40px;
    --surface:light-dark(#ffffff,#121927);
    --surface2:light-dark(#f3f5f9,#1a2333);
    --track:light-dark(#e6eaf1,#1f2937);
    --border:light-dark(#dde3ec,#243145);
    --text:light-dark(#1b2334,#e7edf6);
    --dim:light-dark(#5f6d84,#8fa0b8);
    --accent:light-dark(#3457ff,#7d95ff);
    --ok:light-dark(#15803d,#3ecf8e);
    --warn:light-dark(#b45309,#f2b13d);
    --bad:light-dark(#c2364a,#f3717f);
  }
  .num{ font-variant-numeric:tabular-nums; }
  .dim{ color:var(--dim); }
  /* hidden 属性必须赢过任何 display 声明(.btn 等设了 display:inline-flex,
     否则 hidden 的按钮仍会渲染出来) */
  [hidden]{ display:none !important; }

  .win{
    width:max-content; min-width:460px; max-width:720px;
    border:1px solid var(--border); border-radius:14px; background:var(--surface);
    overflow:hidden; box-shadow:light-dark(0 1px 3px rgba(15,23,42,.06),0 1px 3px rgba(0,0,0,.45));
  }
  body.embedded{ background:transparent; padding:0; justify-content:flex-start; }
  body.embedded .win{ border:none; box-shadow:none; }

  /* 顶部状态带:两个最重要的连通信号(代理/直连) */
  .strip{
    display:flex; align-items:center; gap:6px; padding:10px 16px;
    background:var(--surface2); border-bottom:1px solid var(--border);
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    border:1px solid var(--border); background:var(--surface);
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .chip .d{ width:7px; height:7px; border-radius:99px; background:var(--dim); flex:none; }
  .chip.ok{ color:var(--ok); } .chip.ok .d{ background:var(--ok); }
  .chip.bad{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--border)); }
  .chip.bad .d{ background:var(--bad); }

  /* 断网横幅:代理不通时替换状态带说明区(文本限宽换行,不撑宽卡片) */
  .banner{
    padding:10px 16px; max-width:560px;
    background:color-mix(in srgb,var(--bad) 10%,var(--surface2));
    border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,var(--border));
    font-size:11.5px; color:var(--dim); line-height:1.55;
  }
  .banner b{ color:var(--text); }

  /* 主区:一句结论(+选路模式),整体居中;彩色结论文字自身承载状态,不再放状态灯 */
  .hero{ padding:10px 16px 4px; text-align:center; }
  .state{ display:inline-flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; }
  .state.ok{ color:var(--ok); } .state.bad{ color:var(--bad); } .state.dim{ color:var(--dim); }
  .herosub{ margin-top:5px; font-size:11px; color:var(--dim); font-weight:500; }
  .seg{ margin-left:auto; display:flex; border:1px solid var(--border); border-radius:99px; background:var(--surface); overflow:hidden; flex:none; }
  .seg button{ border:none; background:transparent; color:var(--dim); font-size:10.5px; font-weight:600; padding:4px 9px; cursor:pointer; }
  .seg button + button{ border-left:1px solid var(--border); }
  .seg button.on{ background:var(--accent); color:light-dark(#fff,#0b101a); }
  .tbl.pick tbody tr{ cursor:pointer; }

  /* 节点总览表(常驻平铺;出口=「使用中」标记+整行高亮,唯一答案) */
  .tblwrap{ padding:10px 16px 2px; }
  .tbl{ width:100%; border-collapse:collapse; }
  .tbl th{
    font-size:10px; color:var(--dim); font-weight:600; letter-spacing:.4px; text-align:left;
    padding:4px 6px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  .tbl th.r,.tbl td.r{ text-align:right; }
  .tbl th.c,.tbl td.c{ text-align:center; }
  /* 表头 ⓘ 悬停提示(纯 CSS,无 JS) */
  .tip{ position:relative; cursor:help; margin-left:3px; color:var(--dim); font-size:9px; }
  .tip:hover::after{
    content:attr(data-tip); position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(100% + 7px); z-index:5; width:250px; white-space:normal;
    background:light-dark(#1b2334,#e7edf6); color:light-dark(#fff,#0b101a);
    font-size:10.5px; line-height:1.55; font-weight:400; letter-spacing:0;
    padding:8px 10px; border-radius:8px; text-align:left;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
  }
  .tip:hover::before{
    content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:100%;
    border:5px solid transparent; border-top-color:light-dark(#1b2334,#e7edf6);
  }
  /* down 修饰:紧贴卡片顶部的 ⓘ 向下弹出,避免被 overflow:hidden 裁掉 */
  .tip.down::after{ bottom:auto; top:calc(100% + 7px); }
  .tip.down::before{ bottom:auto; top:100%; transform:translateX(-50%) rotate(180deg);
    border-top-color:transparent; border-bottom-color:light-dark(#1b2334,#e7edf6); }
  .tbl td{ padding:6px 6px; border-bottom:1px solid var(--track); font-size:12px; vertical-align:middle; }
  .tbl tr:last-child td{ border-bottom:none; }
  .st{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; white-space:nowrap; }
  .st::before{ content:''; width:7px; height:7px; border-radius:99px; }
  .st.ok{ color:var(--ok); } .st.ok::before{ background:var(--ok); }
  .st.bad{ color:var(--bad); } .st.bad::before{ background:var(--bad); }
  .nm{ font-weight:500; white-space:nowrap; }
  .nm .mark{ margin-left:5px; }
  .ms{ color:var(--dim); white-space:nowrap; }
  .mb{ white-space:nowrap; }
  .ms .mark,.mb .mark{ margin-left:5px; }
  tr.dead .nm,tr.dead .ms,tr.dead .mb{ color:var(--bad); }
  tr.current td{ background:color-mix(in srgb,var(--accent) 6%,transparent); }
  .mark{ font-size:10px; padding:2px 7px; border-radius:99px; white-space:nowrap; }
  .mark.use{ background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); font-weight:600; }
  .mark.fast{ background:color-mix(in srgb,var(--ok) 14%,transparent); color:var(--ok); font-weight:600; }
  .mark.down{ background:color-mix(in srgb,var(--bad) 14%,transparent); color:var(--bad); font-weight:600; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); font-size:11px; color:var(--text);
    cursor:pointer;
  }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--dim); }
  .btn.ghost:hover{ color:var(--text); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .foot{ display:flex; align-items:center; gap:4px; padding:8px 10px 12px; border-top:1px solid var(--border); }
  .foot .push{ margin-left:auto; }

  /* 实测历史子页(同窗切换;按时间倒序,最近在最上) */
  .h-head{
    display:flex; align-items:center; gap:8px; padding:10px 16px;
    background:var(--surface2); border-bottom:1px solid var(--border); font-size:13px; font-weight:600;
  }
  .h-quota{
    padding:9px 16px; font-size:10.5px; color:var(--dim); line-height:1.6;
    border-bottom:1px solid var(--border); max-width:720px;
  }
  .h-quota b{ color:var(--text); font-weight:600; }
  .h-list{ max-height:520px; overflow-y:auto; }
  .h-row{ display:flex; align-items:baseline; gap:10px; padding:6px 16px; border-bottom:1px solid var(--track); font-size:11.5px; }
  .h-row:last-child{ border-bottom:none; }
  .h-t{ color:var(--dim); width:88px; flex:none; }
  .h-type{ width:92px; flex:none; font-weight:600; }
  .h-sum{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .h-cost{ width:70px; flex:none; text-align:right; color:var(--dim); }
</style>
</head>
<body>
<div class="win" id="win">
  <div id="main-view">
    <div class="strip" id="strip">
      <span class="chip" id="chip-proxy"><span class="d"></span><span id="chip-proxy-t">代理…</span></span>
      <span class="chip" id="chip-direct"><span class="d"></span><span id="chip-direct-t">直连…</span></span>
      <div class="seg" id="mode-seg">
        <button data-mode="delay" title="只按延迟自动挑节点,零实测流量">按延迟</button>
        <button data-mode="sweep" title="定时实测所有节点,拥塞/故障时钉住最快">按实测</button>
        <button data-mode="manual" title="你点谁用谁,测量照跑">按手动</button>
      </div>
    </div>
    <div class="banner" id="banner" hidden></div>

    <div class="hero">
      <div class="state" id="st"><span id="st-text">连接中…</span></div>
      <div class="herosub"><span id="l1-sub"></span><span class="tip down" data-tip="选路规则:按延迟=持续挑延迟最低的节点,免费;按实测=定时实测全部节点,拥塞时钉最快;按手动=你点谁用谁">ⓘ</span></div>
    </div>

    <div class="tblwrap">
      <table class="tbl">
        <thead><tr><th>状态</th><th>节点</th><th>延迟(<span id="th-health-at">—</span>)<span class="tip" data-tip="内核健康检查:每 5 分钟一轮,小请求走节点往返一圈的时间(ms),反映反应速度;通断状态也来自它">ⓘ</span></th><th>实测(<span id="th-sweep-at">—</span>)<span class="tip" data-tip="全量实测:让每个节点下载一个 8MB 测试文件,测出的持续下载速度(Mbps);拥堵/故障时或定时(白天约每 3 小时)触发">ⓘ</span></th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="dim" style="font-size:12px">正在获取节点…</td></tr></tbody>
      </table>
    </div>

    <div class="foot">
      <button class="btn ghost" id="a-delay">延迟测试</button>
      <button class="btn ghost" id="a-sweep">下载实测</button>
      <button class="btn ghost" id="a-handoff" hidden>恢复自动选优</button>
      <button class="btn ghost push" id="a-history">测试历史</button>
      <button class="btn ghost" id="a-restart" hidden>重启内核</button>
    </div>
  </div>

  <div id="history-view" hidden>
    <div class="h-head"><button class="btn ghost" id="a-back">‹ 返回</button><span>测试历史</span></div>
    <div class="h-quota" id="h-quota"></div>
    <div class="h-list" id="h-list"><div class="h-row dim">加载中…</div></div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var last = null, sweep = null, sweepAt = null, nodes = [], lastPosted = "";
  // UI 版本(桥按文件内容哈希注入):菜单栏 App 页面常驻不重载,据此自查过期自动刷新。
  // 注意 App Nap:面板收起时整个 App 被挂起,定时器不跑——所以除了 20s 节拍,
  // 还必须在页面变为可见的那一刻(用户点开面板)立刻查一次,否则会看到旧页面。
  var UI_VERSION = "__UI_VERSION__";
  function checkUiVersion(){
    if (!UI_VERSION || UI_VERSION === "__UI_VERSION__") return;
    fetch("/api/ui-version").then(function(r){ return r.json(); }).then(function(d){
      if (d.v && d.v !== UI_VERSION) location.reload();
    }).catch(function(){});
  }
  setInterval(checkUiVersion, 20000);
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) checkUiVersion();
  });
  checkUiVersion();
  // 供菜单栏 App 原生侧在打开面板瞬间调用(evaluateJavaScript)——App Nap 挂起期间
  // 页面定时器不跑,原生触发是打开即新的最后保障
  window.__fxCheckUiVersion = checkUiVersion;

  // 嵌入菜单栏 popover(WKWebView)时:贴合气泡、把窗口尺寸实时报给原生侧
  var embedded = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.panelSize);
  if (embedded) document.body.classList.add("embedded");

  function postSize(){
    if (!embedded) return;
    var r = document.querySelector(".win").getBoundingClientRect();
    var key = Math.round(r.width) + "x" + Math.round(r.height);
    if (key === lastPosted) return;
    lastPosted = key;
    window.webkit.messageHandlers.panelSize.postMessage({ w: Math.round(r.width), h: Math.round(r.height) });
  }

  // 订阅源节点名会流入 innerHTML,一律转义(面板与桥同源,注入=遥控网关)
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function hhmm(ts){ return ts ? ts.slice(11,16) : null; }

  var HARD_DOWN = { kernel_down:1, all_dead:1, no_nodes:1 };
  var BANNER = {
    all_dead: function(d){ return "<b>通常是订阅过期或流量用尽</b>:更新订阅后自动恢复,服务商换 IP 无需操作。系统每 5 分钟自动重试。国内网络不受影响,微信/淘宝/银行照常可用。"; },
    kernel_down: function(d){ return "<b>mihomo 内核未运行。</b>由 launchd 管理,可自动拉起,或点底部「重启内核」。国内网络不受影响。"; },
    no_nodes: function(d){ return "<b>订阅中没有可用节点。</b>检查订阅链接是否有效,更新订阅后自动恢复。国内网络不受影响。"; }
  };

  function render(s){
    last = s;
    var d = s.derived, g = s.groups, p = s.patrol, dir = s.direct || {};
    // 最新实测吞吐:取最近一次带 sweep 的巡检事件
    sweep = null; sweepAt = null;
    for (var i = p.events.length - 1; i >= 0; i--) {
      if (p.events[i].sweep) { sweep = p.events[i].sweep; sweepAt = hhmm(p.events[i].ts); break; }
    }

    // ---- 出口与模式 ----
    var exitShort = g.pinned ? g.proxy_now_short : g.auto_now_short;
    var uiMode = (s.mode || {}).mode || "sweep";
    var modeText = uiMode === "delay" ? "按延迟自动选优"
                 : uiMode === "manual" ? "手动模式 · 点击节点行切换"
                 : (g.pinned ? "实测钉住最快节点" : "按实测自动选优");

    // ---- 状态带 chips ----
    var down = HARD_DOWN[d.reason] && d.level === "red";
    var proxySt = d.reason === "status_unknown" ? "dim" : (down ? "bad" : "ok");
    setChip($("chip-proxy"), $("chip-proxy-t"), proxySt,
            proxySt === "ok" ? "代理通" : proxySt === "bad" ? "代理不通" : "代理…");
    var dirSt = dir.ok === true ? "ok" : dir.ok === false ? "bad" : "dim";
    setChip($("chip-direct"), $("chip-direct-t"), dirSt,
            dirSt === "ok" ? "直连通" : dirSt === "bad" ? "直连不通" : "直连…");

    // ---- 状态带 vs 断网横幅 ----
    var banner = $("banner");
    if (down && BANNER[d.reason]) {
      $("strip").hidden = true;
      banner.hidden = false;
      banner.innerHTML = BANNER[d.reason](d);
    } else {
      $("strip").hidden = false;
      banner.hidden = true;
      banner.innerHTML = "";
    }

    // ---- 一级结论(状态灯 + st-text;选路模式是此处唯一模式信息) ----
    var stText, stCls;
    if (down) { stText = "代理不通"; stCls = "bad"; }
    else if (d.reason === "status_unknown") { stText = "状态获取中"; stCls = "dim"; }
    else if (d.reason === "sysproxy_off") { stText = "系统代理未生效"; stCls = "dim"; }
    else if (d.reason === "sysproxy_requires_admin") { stText = "系统代理需要授权"; stCls = "dim"; }
    else if (d.reason === "pinned") { stText = "已切换到最快节点"; stCls = "ok"; }
    else { stText = "网络正常"; stCls = "ok"; }
    $("st-text").textContent = stText;
    $("st").className = "state " + stCls;
    $("l1-sub").textContent = down ? "" : modeText;
    $("l1-sub").hidden = !!down;

    // ---- 底部按钮的条件可见性(需要时才提供) ----
    // 恢复自动选优:仅「按实测」模式的钉住状态有意义(把出口交还回 AUTO)
    // 重启内核:保底按钮,仅内核异常或状态失联(正常时 launchd 自管,永远用不到)
    // 下载实测:「按延迟」模式下无实测,隐藏
    $("a-sweep").hidden = uiMode === "delay";
    $("a-handoff").hidden = !(g.pinned && !down && uiMode === "sweep");
    $("a-restart").hidden = !(d.reason === "kernel_down" || d.reason === "status_unknown");

    // ---- 节点总览表(使用中贴节点名后;最快=延迟最低/实测最高,各标各的列) ----
    document.querySelector(".tbl").classList.toggle("pick", uiMode === "manual");
    renderTable(g, exitShort);
    var healthAt = null;
    nodes.forEach(function(n){ if (n.at && (!healthAt || n.at > healthAt)) healthAt = n.at; });
    $("th-health-at").textContent = healthAt || "—";
    $("th-sweep-at").textContent = sweepAt || "—";
    if (!$("history-view").hidden) $("h-quota").innerHTML = quotaLine(p);
    setSeg(uiMode);

    postSize();
  }

  function setSeg(mode){
    document.querySelectorAll("#mode-seg button").forEach(function(b){
      b.classList.toggle("on", b.dataset.mode === mode);
    });
  }

  function setChip(chip, txt, st, label){
    chip.className = "chip " + (st === "ok" ? "ok" : st === "bad" ? "bad" : "");
    txt.textContent = label;
  }
  function shortName(n){ return (n || "").replace(/^.*@/, ""); }
  // 展示用短标签:同域名下只留主机名 + 非 443 端口("c51s5" / "c51s1 :10858"),完整名在 title
  function nodeLabel(n){
    var s = shortName(n);
    if (!s) return s;
    var hostPort = s.split(":");
    var port = hostPort[1] || "443";
    var label = hostPort[0].split(".")[0];
    return port === "443" ? label : label + " :" + port;
  }

  function renderTable(g, exitShort){
    var body = $("rows");
    if (!nodes.length) {
      body.innerHTML = '<tr><td colspan="4" class="dim" style="font-size:12px">正在获取节点…</td></tr>';
      return;
    }
    var rows = nodes.map(function(n){
      var sv = sweep ? (sweep[n.short] != null ? sweep[n.short] : 0) : null;
      return { n: n, sv: sv, label: nodeLabel(n.short) };
    });
    if (sweep) rows.sort(function(a,b){ return (b.sv||0) - (a.sv||0); });
    else rows.sort(function(a,b){
      if (a.n.alive !== b.n.alive) return a.n.alive ? -1 : 1;
      return (a.n.delay||9999) - (b.n.delay||9999);
    });
    var fastest = null;
    rows.forEach(function(r){ if (r.sv != null && r.sv > 0 && r.n.alive && (!fastest || r.sv > fastest.sv)) fastest = r; });
    var delayBest = null;
    rows.forEach(function(r){ if (r.n.alive && r.n.delay > 0 && (!delayBest || r.n.delay < delayBest.d)) delayBest = { r: r, d: r.n.delay }; });

    var html = "";
    rows.forEach(function(r){
      var alive = !!r.n.alive;
      var isExit = r.n.short === exitShort;
      var exitMark = isExit ? '<span class="mark ' + (alive ? "use" : "down") + '">' + (alive ? "使用中" : "出口异常") + '</span>' : "";
      var fastMark = (fastest === r) ? '<span class="mark fast">最快</span>' : "";
      var delayMark = (delayBest && delayBest.r === r) ? '<span class="mark fast">最快</span>' : "";
      html += "<tr data-node='" + esc(r.n.short) + "' class='" + (alive ? "" : "dead ") + (isExit ? "current" : "") + "'>"
        + '<td><span class="st ' + (alive ? "ok" : "bad") + '">' + (alive ? "通" : "断") + '</span></td>'
        + '<td class="nm" title="' + esc(r.n.short) + '">' + esc(r.label) + exitMark + '</td>'
        + '<td class="ms num">' + (alive ? (r.n.delay ? r.n.delay + "ms" : "—") : "超时") + delayMark + '</td>'
        + '<td class="num">' + (r.sv != null ? '<span class="mb">' + r.sv.toFixed(1) + ' Mbps</span>' + fastMark : '<span class="ms">—</span>') + '</td>'
        + '</tr>';
    });
    body.innerHTML = html;
  }

  // ---- 实测历史子页 ----
  function showHistory(on){
    $("main-view").hidden = on;
    $("history-view").hidden = !on;
    if (on) renderHistory();
    postSize();
  }

  var EV_TYPE = {
    steady_ok:"轻探测", pin_ok:"轻探测", keep_pin:"轻探测", keep_auto:"轻探测",
    congestion_pin:"全量实测", fault_switch:"全量实测", repin:"全量实测",
    handoff:"交还自动", all_dead:"全量实测", budget_exhausted:"省流量模式",
    night_ok:"夜间静默", manual_delay:"延迟测试", manual_sweep:"下载实测",
    error:"巡检异常", skip:"跳过"
  };

  function evSummary(e){
    var sw = e.sweep, best = null;
    if (sw) {
      for (var k in sw) if (sw[k] > 0 && (!best || sw[k] > best.v)) best = { n: k, v: sw[k] };
      if (best) return "最快 " + nodeLabel(best.n) + " " + best.v.toFixed(1) + " Mbps";
      return "全部节点无响应";
    }
    switch (e.type) {
      case "steady_ok": return "出口 " + nodeLabel(e.exit) + " " + (e.mbps != null ? e.mbps : "") + " Mbps 达标";
      case "pin_ok": return "钉住节点 " + (e.mbps != null ? e.mbps : "") + " Mbps 达标,回归观察";
      case "keep_pin": return "维持钉住 " + (e.pinned || "") + ",无更优节点";
      case "keep_auto": return "保持常规模式,无更优节点";
      case "manual_delay": return (e.error ? "失败:" + e.error
          : (e.alive != null ? e.alive + "/" + e.total + " 节点存活" : "")
            + (e.best ? ",最快 " + e.best + " " + e.best_ms + "ms" : ""));
      case "all_dead": return "全部节点失联,持续重试中";
      case "budget_exhausted": return "额度用尽,只做连通检查";
      case "night_ok": return "连通正常,夜间未测吞吐";
      case "handoff": return "交还常规模式自动选优";
      case "error": return "异常:" + (e.error || "");
      case "skip": return "跳过(" + (e.reason || "") + ")";
      default: return e.type;
    }
  }

  function quotaLine(p){
    var qhtml = "今日已用 <b class='num'>" + esc(p.cost_today_mb != null ? p.cost_today_mb : "…") + "</b> / <b class='num'>" + esc(p.quota_mb != null ? p.quota_mb : "…") + "</b> MB";
    if (p.last_event && p.last_event.type === "budget_exhausted") qhtml += " · 已用完——<b>只影响测速排名,联网不受影响</b>,明早 00:00 自动恢复";
    return qhtml + " · 全量实测约 48 MB/次,轻探测约 4 MB/次,夜间 0-7 点只查连通(手动实测不计入额度) · 下次巡检 " + esc(p.next_run || "…");
  }

  function renderHistory(){
    $("h-quota").innerHTML = quotaLine(last ? last.patrol : {});

    var list = $("h-list");
    list.innerHTML = '<div class="h-row dim">加载中…</div>';
    fetch("/api/events").then(function(r){ return r.json(); }).then(function(d){
      var evs = (d.events || []).slice().reverse().slice(0, 60);
      if (!evs.length) { list.innerHTML = '<div class="h-row dim">暂无记录</div>'; return; }
      var html = "";
      evs.forEach(function(e){
        var label = e.manual ? (EV_TYPE[e.type] || e.type)
                             : (e.sweep ? "全量实测" : (EV_TYPE[e.type] || e.type));
        var type = (e.manual ? "手动 · " : "自动 · ") + label;
        html += "<div class='h-row'>"
          + "<span class='h-t num'>" + esc((e.ts || "").slice(5, 16)) + "</span>"
          + "<span class='h-type " + (e.type === "all_dead" || e.type === "error" ? "" : "dim") + "'>" + esc(type) + "</span>"
          + "<span class='h-sum'" + (e.sweep ? " title='" + esc(sweepTitle(e.sweep)) + "'" : "") + ">" + esc(evSummary(e)) + "</span>"
          + "<span class='h-cost num'>" + (e.cost_mb > 0 ? "−" + e.cost_mb + " MB" : "—") + "</span>"
          + "</div>";
      });
      list.innerHTML = html;
    }).catch(function(){
      list.innerHTML = '<div class="h-row dim">读取失败,稍后再试</div>';
    });
  }
  function sweepTitle(sw){
    var parts = [];
    for (var k in sw) parts.push(nodeLabel(k) + " " + sw[k].toFixed(1));
    return parts.join(" · ");
  }

  function poll(){
    fetch("/api/status").then(function(r){ return r.json(); }).then(render)
      .catch(function(){
        $("st-text").textContent = "桥接服务未响应";
        $("st").className = "state bad";
        postSize();
      });
  }

  // provider 健康数据(通断/延迟)随 mihomo 每 5 分钟一轮健康检查变化,降频到 60s 拉一次
  function pollProviders(){
    fetch("/api/mihomo/providers/proxies/JMS").then(function(r){ return r.json(); })
      .then(function(d){
        nodes = (d.proxies || []).map(function(p){
          var h = (p.extra && p.extra["https://www.gstatic.com/generate_204"] && p.extra["https://www.gstatic.com/generate_204"].history) || p.history || [];
          var lasth = h.length ? h[h.length - 1] : null;
          return { name: p.name || "",
                   short: (p.name || "").replace(/^.*@/, ""),
                   alive: !!p.alive,
                   delay: lasth ? (lasth.delay || 0) : 0,
                   at: lasth && lasth.time ? String(lasth.time).slice(11,16) : null };
        });
        if (last) render(last);
      })
      .catch(function(){});
  }

  function act(name, btn, opts){
    opts = opts || {};
    if(btn){ btn.disabled = true; setTimeout(function(){ btn.disabled = false; }, opts.disable || 8000); }
    fetch("/api/token").then(function(r){ if(!r.ok) throw Error("无法获取操作凭证"); return r.json(); })
      .then(function(auth){ return fetch("/api/actions/" + name, { method: "POST", headers: {"X-FX-Token": auth.token} }); })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j.ok) throw Error(j.msg || "操作失败");
        setTimeout(poll, opts.poll || 2000);
        if (opts.providers) setTimeout(pollProviders, opts.providers);
      })
      .catch(function(e){ $("st-text").textContent = e.message || "操作失败"; });
  }

  // 三选一选路模式:点击即切换,立即生效(按实测会触发一次全量实测)
  document.querySelectorAll("#mode-seg button").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.classList.contains("on")) return;
      var body = {};
      if (b.dataset.mode === "manual" && last && last.groups) {
        var cur = last.groups.pinned ? last.groups.proxy_now : last.groups.auto_now;
        var full = (nodes.filter(function(n){ return n.short === cur; })[0] || {}).name;
        if (full) body.node = full;
      }
      btn = b;
      btn.disabled = true;
      fetch("/api/token").then(function(r){ return r.json(); })
        .then(function(auth){ return fetch("/api/actions/set-mode-" + b.dataset.mode, {
            method: "POST",
            headers: {"X-FX-Token": auth.token, "Content-Type": "application/json"},
            body: JSON.stringify(body) }); })
        .then(function(r){ return r.json(); })
        .then(function(j){ btn.disabled = false; setTimeout(poll, 1500);
          if (!j.ok) $("st-text").textContent = j.msg || "切换失败"; })
        .catch(function(){ btn.disabled = false; });
    });
  });

  $("a-delay").addEventListener("click", function(){ act("manual-delay", this, { poll: 6000, providers: 8000 }); });
  $("a-sweep").addEventListener("click", function(){ act("manual-sweep", this, { poll: 50000, disable: 70000 }); });
  $("a-handoff").addEventListener("click", function(){ act("handoff-auto", this); });
  $("a-restart").addEventListener("click", function(){ act("kernel-restart", this); });
  $("a-history").addEventListener("click", function(){ showHistory(true); });
  $("a-back").addEventListener("click", function(){ showHistory(false); });

  // 按手动模式:点击节点行切换出口(死亡行除外)
  $("rows").addEventListener("click", function(ev){
    if (!last || (last.mode || {}).mode !== "manual") return;
    var tr = ev.target.closest("tr");
    var nodeName = tr && tr.getAttribute("data-node");
    if (!nodeName || tr.classList.contains("dead")) return;
    var full = (nodes.filter(function(n){ return n.short === nodeName; })[0] || {}).name;
    if (!full) return;
    fetch("/api/token").then(function(r){ return r.json(); })
      .then(function(auth){ return fetch("/api/actions/select-node", {
          method: "POST",
          headers: {"X-FX-Token": auth.token, "Content-Type": "application/json"},
          body: JSON.stringify({node: full}) }); })
      .then(function(r){ return r.json(); })
      .then(function(j){ setTimeout(poll, 1500); if (!j.ok) $("st-text").textContent = j.msg || "切换失败"; })
      .catch(function(){});
  });

  poll();
  pollProviders();
  setInterval(poll, 2000);
  setInterval(pollProviders, 60000);
})();
</script>
</body>
</html>
