<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-internet</title>
<style>
  /* 方案B v3「节点总览表」:顶部状态带(代理/直连/出口) + 节点总览表(通断/延迟/实测/标记)
     + 直连卡;巡检/额度等机制细节弱化置底。信息优先级:
     1) 代理通不通(谁在线、当前走谁) 2) 直连通不通 3) 谁最快、上次何时实测 */
  :root{ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:light-dark(#e9edf3,#0b101a);
    color:light-dark(#1b2334,#e7edf6);
    display:flex; justify-content:center; padding:20px 8px 40px;
    --surface:light-dark(#ffffff,#121927);
    --surface2:light-dark(#f3f5f9,#1a2333);
    --track:light-dark(#e6eaf1,#1f2937);
    --border:light-dark(#dde3ec,#243145);
    --text:light-dark(#1b2334,#e7edf6);
    --dim:light-dark(#5f6d84,#8fa0b8);
    --accent:light-dark(#3457ff,#7d95ff);
    --ok:light-dark(#15803d,#3ecf8e);
    --warn:light-dark(#b45309,#f2b13d);
    --bad:light-dark(#c2364a,#f3717f);
  }
  .num{ font-variant-numeric:tabular-nums; }
  .dim{ color:var(--dim); }

  .win{
    width:min(400px,100%);
    border:1px solid var(--border); border-radius:14px; background:var(--surface);
    overflow:hidden; box-shadow:light-dark(0 1px 3px rgba(15,23,42,.06),0 1px 3px rgba(0,0,0,.45));
  }
  body.embedded{ background:transparent; padding:0; justify-content:flex-start; }
  body.embedded .win{ border:none; box-shadow:none; }

  /* 一级区:绿态 150 / 其余 210(selftest 断言依赖) */
  .body-l1{
    height:210px; display:flex; flex-direction:column;
  }
  .win.compact .body-l1{ height:150px; }

  /* 顶部状态带:两个最重要的信号(代理/直连)+ 当前出口 */
  .strip{
    display:flex; align-items:center; gap:6px; padding:10px 14px;
    background:var(--surface2); border-bottom:1px solid var(--border); flex:none;
  }
  .chip{
    display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px;
    border:1px solid var(--border); background:var(--surface);
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .chip .d{ width:7px; height:7px; border-radius:99px; background:var(--dim); flex:none; }
  .chip.ok{ color:var(--ok); } .chip.ok .d{ background:var(--ok); }
  .chip.bad{ color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%,var(--border)); }
  .chip.bad .d{ background:var(--bad); }
  .strip-exit{
    margin-left:auto; font-size:11px; color:var(--dim); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .strip-exit b{ color:var(--text); font-weight:600; }

  /* 断网横幅:代理不通时替换状态带说明区 */
  .banner{
    padding:10px 14px; flex:none;
    background:color-mix(in srgb,var(--bad) 10%,var(--surface2));
    border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,var(--border));
    font-size:11.5px; color:var(--dim); line-height:1.55;
  }
  .banner b{ color:var(--text); }

  /* 主区:一句结论 + 出口明细 */
  .hero{ flex:1; padding:10px 16px 12px; display:flex; flex-direction:column; justify-content:space-evenly; min-height:0; }
  .state{ display:flex; align-items:center; gap:9px; font-size:19px; font-weight:700; }
  .lamp{ width:12px; height:12px; border-radius:99px; flex:none; background:var(--dim); }
  .lamp.ok{ background:var(--ok); box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 16%,transparent); }
  .lamp.bad{ background:var(--bad); box-shadow:0 0 0 4px color-mix(in srgb,var(--bad) 16%,transparent); }
  .state.ok{ color:var(--ok); } .state.bad{ color:var(--bad); } .state.dim{ color:var(--dim); }
  .herosub{ font-size:11.5px; color:var(--dim); font-weight:500; }
  .exitline{ font-size:12px; color:var(--dim); }
  .exitline b{ color:var(--text); font-weight:600; }

  .btn{
    display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:8px;
    border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--text);
    cursor:pointer;
  }
  .btn.primary{ background:var(--accent); border-color:transparent; color:light-dark(#fff,#0b101a); }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--dim); }
  .btn.ghost:hover{ color:var(--text); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .openbtn{ align-self:center; margin-top:4px; }

  /* 二级:节点总览表(用户展开) */
  .detail{ border-top:1px solid var(--border); display:none; }
  .detail.show{ display:block; }
  .tblwrap{ padding:10px 14px 2px; }
  .tbl{ width:100%; border-collapse:collapse; }
  .tbl th{
    font-size:10px; color:var(--dim); font-weight:600; letter-spacing:.4px; text-align:left;
    padding:4px 5px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  .tbl th.r,.tbl td.r{ text-align:right; }
  .tbl td{ padding:6px 5px; border-bottom:1px solid var(--track); font-size:12px; vertical-align:middle; }
  .tbl tr:last-child td{ border-bottom:none; }
  .st{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; white-space:nowrap; }
  .st::before{ content:''; width:7px; height:7px; border-radius:99px; }
  .st.ok{ color:var(--ok); } .st.ok::before{ background:var(--ok); }
  .st.bad{ color:var(--bad); } .st.bad::before{ background:var(--bad); }
  .nm{ font-weight:500; max-width:112px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ms{ color:var(--dim); white-space:nowrap; }
  .cellbar{ display:flex; align-items:center; gap:6px; }
  .rowbar{ position:relative; width:64px; height:5px; border-radius:99px; background:var(--track); overflow:hidden; flex:none; }
  .rowbar i{ position:absolute; inset:0 auto 0 0; border-radius:99px; background:var(--ok); }
  .mb{ font-weight:600; white-space:nowrap; }
  tr.dead .nm,tr.dead .ms,tr.dead .mb{ color:var(--bad); }
  tr.dead .rowbar i{ background:var(--bad); }
  tr.current td{ background:color-mix(in srgb,var(--accent) 6%,transparent); }
  .mark{ font-size:10px; padding:2px 7px; border-radius:99px; white-space:nowrap; }
  .mark.use{ background:color-mix(in srgb,var(--accent) 14%,transparent); color:var(--accent); font-weight:600; }
  .mark.fast{ background:color-mix(in srgb,var(--ok) 14%,transparent); color:var(--ok); font-weight:600; }
  .mark.down{ background:color-mix(in srgb,var(--bad) 14%,transparent); color:var(--bad); font-weight:600; }
  .tbl-note{ font-size:10.5px; color:var(--dim); margin:7px 2px 0; line-height:1.55; }

  /* 直连卡 */
  .direct{
    margin:10px 14px 0; display:flex; align-items:center; gap:8px; padding:8px 11px; border-radius:9px;
    border:1px solid var(--border); background:var(--surface2); font-size:11.5px;
  }
  .direct .d{ width:7px; height:7px; border-radius:99px; background:var(--dim); flex:none; }
  .direct.ok .d{ background:var(--ok); } .direct.bad .d{ background:var(--bad); }
  .direct b{ font-weight:600; }
  .direct .why{ margin-left:auto; color:var(--dim); font-size:10.5px; white-space:nowrap; }

  /* 机制细节:弱化置底 */
  .mech{
    margin-top:10px; padding:9px 14px 10px; background:var(--surface2); border-top:1px solid var(--border);
    font-size:10.5px; color:var(--dim); line-height:1.6;
  }
  .mech b{ color:var(--text); font-weight:600; }
  .foot{ display:flex; align-items:center; gap:4px; padding:8px 10px 12px; border-top:1px solid var(--border); }
  .foot .btn{ height:24px; font-size:11px; padding:0 8px; }
</style>
</head>
<body>
<div class="win compact" id="win">
  <div class="body-l1" id="l1">
    <div class="strip" id="strip">
      <span class="chip" id="chip-proxy"><span class="d"></span><span id="chip-proxy-t">代理…</span></span>
      <span class="chip" id="chip-direct"><span class="d"></span><span id="chip-direct-t">直连…</span></span>
      <span class="strip-exit" id="strip-exit"></span>
    </div>
    <div class="banner" id="banner" hidden></div>
    <div class="hero">
      <div class="state" id="st"><span class="lamp" id="lamp"></span><span id="st-text">连接中…</span><span class="herosub" id="l1-sub"></span></div>
      <div class="exitline" id="l1-exit"></div>
      <button class="btn ghost openbtn" id="open-btn">节点明细与测速 ▾</button>
    </div>
  </div>

  <div class="detail" id="detail">
    <div class="tblwrap">
      <table class="tbl">
        <thead><tr><th>状态</th><th>节点</th><th class="r">延迟</th><th>实测(<span id="th-sweep-at">—</span>)</th><th class="r">标记</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="dim" style="font-size:12px">正在获取节点…</td></tr></tbody>
      </table>
      <div class="tbl-note" id="tbl-note"></div>
    </div>
    <div class="direct" id="direct-card"><span class="d"></span><span id="direct-t">直连检测中…</span><span class="why" id="direct-why"></span></div>
    <div class="mech" id="mech"></div>
    <div class="foot">
      <button class="btn ghost" id="a-patrol">立即巡检</button>
      <button class="btn ghost" id="a-handoff">交还常规</button>
      <button class="btn ghost" id="a-restart">重启内核</button>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var open = false, last = null, sweep = null, sweepAt = null, nodes = [], lastPosted = "";
  // UI 版本(桥按文件内容哈希注入):菜单栏 App 页面常驻不重载,据此自查过期自动刷新
  var UI_VERSION = "__UI_VERSION__";
  setInterval(function(){
    if (!UI_VERSION || UI_VERSION === "__UI_VERSION__") return;
    fetch("/api/ui-version").then(function(r){ return r.json(); }).then(function(d){
      if (d.v && d.v !== UI_VERSION) location.reload();
    }).catch(function(){});
  }, 20000);

  // 嵌入菜单栏 popover(WKWebView)时:贴合气泡、把窗口尺寸实时报给原生侧
  var embedded = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.panelSize);
  if (embedded) document.body.classList.add("embedded");

  function postSize(){
    if (!embedded) return;
    var r = document.querySelector(".win").getBoundingClientRect();
    var key = Math.round(r.width) + "x" + Math.round(r.height);
    if (key === lastPosted) return;
    lastPosted = key;
    window.webkit.messageHandlers.panelSize.postMessage({ w: Math.round(r.width), h: Math.round(r.height) });
  }

  // 订阅源节点名会流入 innerHTML,一律转义(面板与桥同源,注入=遥控网关)
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function hhmm(ts){ return ts ? ts.slice(11,16) : null; }

  var HARD_DOWN = { kernel_down:1, all_dead:1, no_nodes:1 };
  var BANNER = {
    all_dead: function(d){ return "<b>通常是订阅过期或流量用尽</b>:更新订阅后自动恢复,服务商换 IP 无需操作。系统每 5 分钟自动重试。国内网络不受影响,微信/淘宝/银行照常可用。"; },
    kernel_down: function(d){ return "<b>mihomo 内核未运行。</b>由 launchd 管理,可自动拉起,或点底部「重启内核」。国内网络不受影响。"; },
    no_nodes: function(d){ return "<b>订阅中没有可用节点。</b>检查订阅链接是否有效,更新订阅后自动恢复。国内网络不受影响。"; }
  };

  function render(s){
    last = s;
    var d = s.derived, g = s.groups, p = s.patrol, dir = s.direct || {};
    // 最新实测吞吐:取最近一次带 sweep 的巡检事件
    sweep = null; sweepAt = null;
    for (var i = p.events.length - 1; i >= 0; i--) {
      if (p.events[i].sweep) { sweep = p.events[i].sweep; sweepAt = hhmm(p.events[i].ts); break; }
    }

    // ---- 出口与模式 ----
    var exitShort = g.pinned ? g.proxy_now_short : g.auto_now_short;
    var exitNode = null;
    for (var i = 0; i < nodes.length; i++) if (nodes[i].short === exitShort) exitNode = nodes[i];
    var modeText = g.pinned ? "巡检钉住" : "常规模式自动选优";

    // ---- 状态带 chips ----
    var down = HARD_DOWN[d.reason] && d.level === "red";
    var budgetOut = !!(p.last_event && p.last_event.type === "budget_exhausted");
    var proxySt = d.reason === "status_unknown" ? "dim" : (down ? "bad" : "ok");
    setChip($("chip-proxy"), $("chip-proxy-t"), proxySt,
            proxySt === "ok" ? "代理通" : proxySt === "bad" ? "代理不通" : "代理…");
    var dirSt = dir.ok === true ? "ok" : dir.ok === false ? "bad" : "dim";
    setChip($("chip-direct"), $("chip-direct-t"), dirSt,
            dirSt === "ok" ? "直连通" : dirSt === "bad" ? "直连不通" : "直连…");
    $("strip-exit").innerHTML = "出口 <b>" + esc(nodeLabel(exitShort)) + "</b> · " + esc(modeText);

    // ---- 状态带 vs 断网横幅 ----
    var banner = $("banner");
    if (down && BANNER[d.reason]) {
      $("strip").hidden = true;
      banner.hidden = false;
      banner.innerHTML = BANNER[d.reason](d);
    } else {
      $("strip").hidden = false;
      banner.hidden = true;
      banner.innerHTML = "";
    }

    // ---- 一级结论(状态灯 + st-text) ----
    var stText, stCls;
    if (down) { stText = "代理不通"; stCls = "bad"; }
    else if (d.reason === "status_unknown") { stText = "状态获取中"; stCls = "dim"; }
    else if (d.reason === "sysproxy_off") { stText = "系统代理未生效"; stCls = "dim"; }
    else if (d.reason === "sysproxy_requires_admin") { stText = "系统代理需要授权"; stCls = "dim"; }
    else if (d.reason === "pinned") { stText = "已切换到最快节点"; stCls = "ok"; }
    else { stText = "网络正常"; stCls = "ok"; }
    $("st-text").textContent = stText;
    $("st").className = "state " + stCls;
    $("lamp").className = "lamp " + stCls;
    $("l1-sub").textContent = down ? "" : modeText;
    $("win").classList.toggle("compact", d.level === "green");

    // ---- 出口明细行 ----
    var bits = [];
    if (exitShort) {
      bits.push("出口 <b>" + esc(nodeLabel(exitShort)) + "</b>");
      if (exitNode) bits.push("健康 " + (exitNode.alive ? "<b class='num'>" + esc(exitNode.delay) + " ms</b>" : "<b>超时</b>"));
      if (sweep && sweep[exitShort] > 0) bits.push("实测 <b class='num'>" + sweep[exitShort].toFixed(1) + "</b> Mbps" + (sweepAt ? "(" + esc(sweepAt) + ")" : ""));
      $("l1-exit").innerHTML = bits.join(" · ");
    } else {
      $("l1-exit").textContent = "";
    }

    // ---- 二级:节点总览表 ----
    renderTable(g, exitShort);
    $("th-sweep-at").textContent = sweepAt || "—";
    $("tbl-note").textContent = tableNote();

    // ---- 直连卡 ----
    var dc = $("direct-card");
    dc.className = "direct " + (dirSt === "ok" ? "ok" : dirSt === "bad" ? "bad" : "");
    $("direct-t").innerHTML = dirSt === "ok"
      ? "<b>直连通</b>&nbsp;国内网络正常,微信/淘宝/银行照常"
      : dirSt === "bad"
        ? "<b>直连不通</b>&nbsp;检查 Wi-Fi/网线:国内网站也打不开时,与代理无关"
        : "直连检测中…";
    $("direct-why").textContent = dir.checked_at ? "不走代理 · " + dir.checked_at : "不走代理";

    // ---- 机制行(弱化) ----
    var mech = "今日测速额度 <b class='num'>" + esc(p.cost_today_mb) + "</b> / <b class='num'>" + esc(p.quota_mb) + "</b> MB";
    if (budgetOut) mech += " · 已用完——<b>只影响测速排名,联网不受影响</b>,明早 00:00 自动恢复";
    mech += " · 实时 " + esc((s.traffic.mbps || 0).toFixed(1)) + " Mbps · 下次巡检 " + esc(p.next_run) + " · 端口 " + esc(s.kernel.port);
    $("mech").innerHTML = mech;

    postSize();
  }

  function setChip(chip, txt, st, label){
    chip.className = "chip " + (st === "ok" ? "ok" : st === "bad" ? "bad" : "");
    txt.textContent = label;
  }
  function shortName(n){ return (n || "").replace(/^.*@/, ""); }
  // 展示用短标签:同域名下只留主机名 + 非 443 端口("c51s5" / "c51s1 :10858"),完整名在 title
  function nodeLabel(n){
    var s = shortName(n);
    if (!s) return s;
    var hostPort = s.split(":");
    var port = hostPort[1] || "443";
    var label = hostPort[0].split(".")[0];
    return port === "443" ? label : label + " :" + port;
  }

  function renderTable(g, exitShort){
    var body = $("rows");
    if (!nodes.length) {
      body.innerHTML = '<tr><td colspan="5" class="dim" style="font-size:12px">正在获取节点…</td></tr>';
      return;
    }
    var rows = nodes.map(function(n){
      var sv = sweep ? (sweep[n.short] != null ? sweep[n.short] : 0) : null;
      return { n: n, sv: sv, label: nodeLabel(n.short) };
    });
    if (sweep) rows.sort(function(a,b){ return (b.sv||0) - (a.sv||0); });
    else rows.sort(function(a,b){
      if (a.n.alive !== b.n.alive) return a.n.alive ? -1 : 1;
      return (a.n.delay||9999) - (b.n.delay||9999);
    });
    var maxv = 1;
    rows.forEach(function(r){ if (r.sv > maxv) maxv = r.sv; });
    var fastest = null;
    rows.forEach(function(r){ if (r.sv != null && r.sv > 0 && r.n.alive && (!fastest || r.sv > fastest.sv)) fastest = r; });
    var exitDead = null;
    rows.forEach(function(r){ if (r.n.short === exitShort && !r.n.alive) exitDead = r; });

    var html = "";
    rows.forEach(function(r){
      var alive = !!r.n.alive;
      var isExit = r.n.short === exitShort;
      var marks = "";
      if (isExit) marks += '<span class="mark ' + (alive ? "use" : "down") + '">' + (alive ? "使用中" : "出口异常") + '</span>';
      else if (fastest === r && exitShort) marks += '<span class="mark fast">最快</span>';
      html += "<tr class='" + (alive ? "" : "dead ") + (isExit ? "current" : "") + "'>"
        + '<td><span class="st ' + (alive ? "ok" : "bad") + '">' + (alive ? "通" : "断") + '</span></td>'
        + '<td class="nm" title="' + esc(r.n.short) + '">' + esc(r.label) + '</td>'
        + '<td class="r ms num">' + (alive ? (r.n.delay ? r.n.delay + "ms" : "—") : "超时") + '</td>'
        + '<td><div class="cellbar">'
        + (r.sv != null ? '<div class="rowbar"><i style="width:' + Math.max(r.sv/maxv*100, 2) + '%"></i></div><span class="mb num">' + r.sv.toFixed(1) + '</span>' : '<span class="ms">—</span>')
        + '</div></td>'
        + '<td class="r">' + marks + '</td></tr>';
    });
    body.innerHTML = html;
  }

  function tableNote(){
    var healthAt = null;
    nodes.forEach(function(n){ if (n.at && (!healthAt || n.at > healthAt)) healthAt = n.at; });
    var parts = [];
    parts.push("通断/延迟 = 健康检查" + (healthAt ? "(测于 " + healthAt + ")" : "(每 5 分钟一轮)"));
    parts.push(sweepAt ? "实测 = 最近全量测速(" + sweepAt + "),拥堵/故障时才触发" : "实测 = 等待巡检(拥堵/故障时触发,或点「立即巡检」)");
    return parts.join(" · ");
  }

  function poll(){
    fetch("/api/status").then(function(r){ return r.json(); }).then(render)
      .catch(function(){
        $("st-text").textContent = "桥接服务未响应";
        $("st").className = "state bad"; $("lamp").className = "lamp bad";
        postSize();
      });
  }

  // provider 健康数据(通断/延迟)随 mihomo 每 5 分钟一轮健康检查变化,降频到 60s 拉一次
  function pollProviders(){
    fetch("/api/mihomo/providers/proxies/JMS").then(function(r){ return r.json(); })
      .then(function(d){
        nodes = (d.proxies || []).map(function(p){
          var h = (p.extra && p.extra["https://www.gstatic.com/generate_204"] && p.extra["https://www.gstatic.com/generate_204"].history) || p.history || [];
          var lasth = h.length ? h[h.length - 1] : null;
          return { name: p.name || "",
                   short: (p.name || "").replace(/^.*@/, ""),
                   alive: !!p.alive,
                   delay: lasth ? (lasth.delay || 0) : 0,
                   at: lasth && lasth.time ? String(lasth.time).slice(11,16) : null };
        });
        if (last) render(last);
      })
      .catch(function(){});
  }

  function act(name, btn){
    if(btn){ btn.disabled = true; setTimeout(function(){ btn.disabled = false; }, 8000); }
    fetch("/api/token").then(function(r){ if(!r.ok) throw Error("无法获取操作凭证"); return r.json(); })
      .then(function(auth){ return fetch("/api/actions/" + name, { method: "POST", headers: {"X-FX-Token": auth.token} }); })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!j.ok) throw Error(j.msg || "操作失败"); setTimeout(poll, name === "patrol-now" ? 6000 : 2000); })
      .catch(function(e){ $("st-text").textContent = e.message || "操作失败"; });
  }

  $("open-btn").addEventListener("click", function(){
    open = !open;
    $("detail").classList.toggle("show", open);
    this.textContent = open ? "收起明细 ▴" : "节点明细与测速 ▾";
    postSize();  // 立即上报新尺寸,展开/收起由 popover 原生动画平滑完成
  });
  $("a-patrol").addEventListener("click", function(){ act("patrol-now", this); });
  $("a-handoff").addEventListener("click", function(){ act("handoff-auto", this); });
  $("a-restart").addEventListener("click", function(){ act("kernel-restart", this); });

  poll();
  pollProviders();
  setInterval(poll, 2000);
  setInterval(pollProviders, 60000);
})();
</script>
</body>
</html>
